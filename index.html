<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cobrinha Neon</title>
<meta name="description" content="Jogo da cobrinha com visual neon: comida, ouro, gelo e fantasma. Funciona no celular e sem internet.">
<meta name="theme-color" content="#07060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Aplica o tema escolhido antes de desenhar a página (evita piscar).
  try { const t = localStorage.getItem('cobrinha-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #07060f;
    --panel: #120f24;
    --grid: #1a1633;
    --edge: #2a2450;
    --overlay: rgba(7,6,15,.78);
    --pad: #1f1a3d;
    --on-accent: #07060f;
    --eye: #07060f;
    --snake: #39ffb4;
    --food: #ff3e8a;
    --slow: #4cc9ff;
    --ghost: #c77dff;
    --gold: #ffd84c;
    --text: #e9e6ff;
    --muted: #8a84b8;
    --glow: 1;
    color-scheme: dark;
  }
  /* Tema claro: as mesmas cores, mais escuras para aparecer no fundo branco */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f0fb; --panel: #ffffff; --grid: #ebe7f7; --edge: #d9d2f0; --overlay: rgba(243,240,251,.86);
      --pad: #e4def6; --on-accent: #ffffff; --eye: #ffffff;
      --snake: #0aa874; --food: #e0256f; --slow: #1b8fd0; --ghost: #8f45d6; --gold: #c98a00;
      --text: #1d1640; --muted: #645d8c; --glow: .45; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f0fb; --panel: #ffffff; --grid: #ebe7f7; --edge: #d9d2f0; --overlay: rgba(243,240,251,.86);
    --pad: #e4def6; --on-accent: #ffffff; --eye: #ffffff;
    --snake: #0aa874; --food: #e0256f; --slow: #1b8fd0; --ghost: #8f45d6; --gold: #c98a00;
    --text: #1d1640; --muted: #645d8c; --glow: .45; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: safe center; gap: 12px; padding: 16px; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); letter-spacing: 2px;
    color: var(--snake); text-shadow: 0 0 8px var(--snake), 0 0 24px var(--snake); }
  .hud { display: flex; gap: 18px; font-size: 15px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .hud b { color: var(--text); font-size: 18px; }
  .stage { position: relative; }
  canvas { display: block; background: var(--panel); border-radius: 12px;
    box-shadow: 0 0 0 2px var(--edge), 0 0 40px color-mix(in srgb, var(--snake) 15%, transparent); }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: var(--overlay); border-radius: 12px; padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 28px; color: var(--food); text-shadow: 0 0 12px var(--food); }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 320px; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; text-align: left; font-size: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; }
  button { font: inherit; font-weight: 600; color: var(--on-accent); background: var(--snake);
    border: 0; border-radius: 999px; padding: 10px 26px; cursor: pointer;
    box-shadow: 0 0 16px var(--snake); }
  button:active { transform: scale(.96); }
  .status { min-height: 20px; font-size: 14px; }
  .pad { display: none; grid-template-columns: repeat(3, 56px); gap: 6px; }
  .pad button { padding: 0; height: 56px; background: var(--pad); color: var(--text); box-shadow: none; font-size: 22px; }
  @media (pointer: coarse) { .pad { display: grid; } }
  /* Botões do canto: instalar e tema */
  .cantos { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px; z-index: 2; }
  .cantos button { box-shadow: none; background: transparent; color: var(--muted); border: 1.5px solid var(--edge);
    padding: 0; width: 40px; height: 40px; display: grid; place-items: center; }
  .cantos button:hover { color: var(--text); }
  .cantos .instalar { width: auto; padding: 0 14px; color: var(--on-accent); background: var(--snake); border-color: var(--snake); font-size: 14px; }
  .cantos svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cantos .ic-sol circle { fill: currentColor; stroke: none; }
  .ic-sol, .escuro .ic-lua { display: none; }
  .escuro .ic-sol { display: block; }
  [hidden] { display: none !important; }
  .priv { font-size: 12px; color: var(--muted); }
  .topo { display: flex; justify-content: center; width: 100%; }
  /* Celular: título e botões na mesma linha, para os botões não cobrirem nada */
  @media (pointer: coarse), (max-width: 600px) {
    .wrap { gap: 8px; padding: 12px 16px; }
    .topo { justify-content: space-between; align-items: center; gap: 8px; }
    h1 { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
    .cantos { position: static; gap: 6px; flex: none; }
    .cantos button { width: 36px; height: 36px; }
    .cantos .instalar { padding: 0 12px; font-size: 13px; }
    /* Dentro do app, Atualizar não disputa atenção com o jogo */
    .cantos .instalar[data-apk-pronto="app"] { background: transparent; color: var(--muted); border-color: var(--edge); }
  }
  /* Tela baixa: direcional e instruções menores, para sobrar tabuleiro */
  @media (pointer: coarse) and (max-height: 700px) {
    .pad { grid-template-columns: repeat(3, 48px); }
    .pad button { height: 48px; font-size: 18px; }
  }
  @media (pointer: coarse) and (max-height: 620px) {
    .overlay { padding: 8px 10px; gap: 5px; }
    .overlay h2 { font-size: 20px; }
    .overlay p { font-size: 12.5px; line-height: 1.3; }
    .legend { font-size: 12px; gap: 2px 8px; }
    .dot { width: 11px; height: 11px; margin-top: 2px; }
    .overlay button { padding: 6px 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topo">
    <h1>COBRINHA NEON</h1>
    <div class="cantos">
      <button type="button" class="instalar" id="instalar" data-app-apk hidden>Instalar</button>
      <button type="button" id="tema" aria-label="Mudar para o tema claro" title="Mudar para o tema claro">
        <svg class="ic-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="ic-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
    </div>
  </header>
  <div class="hud">
    <span>Pontos <b id="score">0</b></span>
    <span>Recorde <b id="best">0</b></span>
    <span>Nível <b id="level">1</b></span>
  </div>
  <div class="status" id="status"></div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Pronto?</h2>
      <p id="ovText">Setas ou WASD para mover · Espaço para pausar<br>No celular, deslize o dedo.</p>
      <div class="legend">
        <span class="dot" style="background:var(--food);box-shadow:0 0 8px var(--food)"></span><span>Comida: +10 e cresce</span>
        <span class="dot" style="background:var(--gold);box-shadow:0 0 8px var(--gold)"></span><span>Ouro: +50, some rápido</span>
        <span class="dot" style="background:var(--slow);box-shadow:0 0 8px var(--slow)"></span><span>Gelo: deixa tudo lento</span>
        <span class="dot" style="background:var(--ghost);box-shadow:0 0 8px var(--ghost)"></span><span>Fantasma: atravessa paredes e o corpo</span>
      </div>
      <button id="startBtn">Jogar</button>
    </div>
  </div>
  <div class="pad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button data-dir="pause">❚❚</button><button data-dir="right">▶</button>
    <span></span><button data-dir="down">▼</button><span></span>
  </div>
  <a class="priv" href="privacidade.html">Política de privacidade</a>
</div>

<script>
const N = 22;                       // células por lado
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
// Cores do desenho: lidas do CSS, para acompanhar o tema claro/escuro.
const COLORS = {};
let GRID = '#1a1633', EYE = '#07060f', GLOW = 1;
function readColors() {
  const css = getComputedStyle(document.documentElement);
  for (const k of ['food', 'gold', 'slow', 'ghost', 'snake']) COLORS[k] = css.getPropertyValue('--' + k).trim();
  GRID = css.getPropertyValue('--grid').trim();
  EYE = css.getPropertyValue('--eye').trim();
  GLOW = parseFloat(css.getPropertyValue('--glow')) || 1;
}
readColors();

let cell, snake, dir, queue, items, score, level, running, paused, lastStep, effects, particles;

function loadBest() { try { return +localStorage.getItem('cobrinha-best') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('cobrinha-best', v); } catch {} }
let best = loadBest();
let bestAtStart = best;
$('best').textContent = best;

// Altura de tudo que fica em volta do tabuleiro, medida na tela de verdade
function alturaEmVolta() {
  const wrap = document.querySelector('.wrap');
  const estilo = getComputedStyle(wrap);
  const itens = Array.from(wrap.children).filter(el => el.offsetHeight > 0 || el.classList.contains('stage'));
  let total = parseFloat(estilo.paddingTop) + parseFloat(estilo.paddingBottom)
    + parseFloat(estilo.rowGap) * (itens.length - 1);
  for (const el of itens) if (!el.classList.contains('stage')) total += el.offsetHeight;
  return total;
}

function resize() {
  const avail = Math.min(window.innerWidth - 32, window.innerHeight - alturaEmVolta(), 560);
  cell = Math.max(10, Math.floor(avail / N));
  const px = cell * N, dpr = window.devicePixelRatio || 1;
  canvas.style.width = canvas.style.height = px + 'px';
  canvas.width = canvas.height = px * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function reset() {
  const m = N >> 1;
  snake = [[m, m], [m - 1, m], [m - 2, m]];
  dir = 'right'; queue = [];
  items = []; particles = [];
  score = 0; level = 1;
  effects = { slow: 0, ghost: 0 };
  spawn('food');
  updateHud();
}

function freeCell() {
  while (true) {
    const p = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)];
    if (!snake.some(s => s[0] === p[0] && s[1] === p[1]) && !items.some(i => i.x === p[0] && i.y === p[1])) return p;
  }
}

function spawn(type) {
  const [x, y] = freeCell();
  const life = { food: Infinity, gold: 5000, slow: 8000, ghost: 8000 }[type];
  items.push({ type, x, y, born: performance.now(), life });
}

function stepInterval() {
  let ms = Math.max(55, 140 - (level - 1) * 9);
  if (effects.slow > 0) ms *= 1.8;
  return ms;
}

function turn(d) {
  if (!running) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  const [ax, ay] = DIRS[last], [bx, by] = DIRS[d];
  if (ax + bx === 0 && ay + by === 0) return;   // não deixa virar ao contrário
  if (d === last) return;
  if (queue.length < 3) queue.push(d);
}

function step(now) {
  if (queue.length) dir = queue.shift();
  const [dx, dy] = DIRS[dir];
  let hx = snake[0][0] + dx, hy = snake[0][1] + dy;
  const ghost = effects.ghost > 0;

  if (hx < 0 || hy < 0 || hx >= N || hy >= N) {
    if (!ghost) return gameOver();
    hx = (hx + N) % N; hy = (hy + N) % N;
  }
  if (!ghost && snake.some((s, i) => i < snake.length - 1 && s[0] === hx && s[1] === hy)) return gameOver();

  snake.unshift([hx, hy]);
  const hit = items.findIndex(i => i.x === hx && i.y === hy);
  if (hit >= 0) {
    const it = items.splice(hit, 1)[0];
    burst(hx, hy, COLORS[it.type]);
    if (it.type === 'food') {
      score += 10;
      spawn('food');
      if (Math.random() < 0.18) spawn('gold');
      else if (Math.random() < 0.15) spawn(Math.random() < 0.5 ? 'slow' : 'ghost');
    } else if (it.type === 'gold') {
      score += 50; snake.pop();
    } else {
      effects[it.type] = it.type === 'slow' ? 6000 : 5000;
      snake.pop();
    }
    level = 1 + Math.floor(score / 60);
    updateHud();
  } else {
    snake.pop();
  }

  items = items.filter(i => now - i.born < i.life);
}

function burst(x, y, color) {
  for (let k = 0; k < 18; k++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
    particles.push({ x: (x + .5) * cell, y: (y + .5) * cell, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color });
  }
}

function updateHud() {
  $('score').textContent = score;
  $('level').textContent = level;
  if (score > best) { best = score; saveBest(best); }
  $('best').textContent = best;
}

function statusText() {
  const parts = [];
  if (effects.slow > 0) parts.push(`<span style="color:${COLORS.slow}">❄ Lento ${Math.ceil(effects.slow / 1000)}s</span>`);
  if (effects.ghost > 0) parts.push(`<span style="color:${COLORS.ghost}">👻 Fantasma ${Math.ceil(effects.ghost / 1000)}s</span>`);
  if (paused) parts.push('⏸ Pausado');
  $('status').innerHTML = parts.join(' · ');
}

function glowCircle(x, y, r, color, blur) {
  ctx.shadowColor = color; ctx.shadowBlur = blur * GLOW; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  if (!snake) return;
  const px = cell * N, now = performance.now();
  ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, px, px);

  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell + .5, 0); ctx.lineTo(i * cell + .5, px); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell + .5); ctx.lineTo(px, i * cell + .5); ctx.stroke();
  }

  for (const it of items) {
    const pulse = 1 + Math.sin(now / 150) * .12;
    const left = it.life - (now - it.born);
    if (left < 1500 && Math.floor(now / 120) % 2) continue;   // pisca antes de sumir
    glowCircle((it.x + .5) * cell, (it.y + .5) * cell, cell * .32 * pulse, COLORS[it.type], 18);
  }

  const ghost = effects.ghost > 0;
  const color = ghost ? COLORS.ghost : effects.slow > 0 ? COLORS.slow : COLORS.snake;
  ctx.globalAlpha = ghost ? .6 : 1;
  snake.forEach((s, i) => {
    const t = 1 - i / (snake.length + 4);
    ctx.shadowColor = color; ctx.shadowBlur = (i === 0 ? 22 : 12) * GLOW;
    ctx.fillStyle = color;
    ctx.globalAlpha = (ghost ? .6 : 1) * (.45 + .55 * t);
    const pad = i === 0 ? 1.5 : 2.5;
    ctx.beginPath();
    ctx.roundRect(s[0] * cell + pad, s[1] * cell + pad, cell - pad * 2, cell - pad * 2, cell * .3);
    ctx.fill();
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // olhinhos
  const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
  ctx.fillStyle = EYE;
  for (const side of [-1, 1]) {
    const ex = (hx + .5 + dx * .18 - dy * .2 * side) * cell;
    const ey = (hy + .5 + dy * .18 + dx * .2 * side) * cell;
    ctx.beginPath(); ctx.arc(ex, ey, cell * .09, 0, Math.PI * 2); ctx.fill();
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    glowCircle(p.x, p.y, 2.2, p.color, 10);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

let prev = 0;
function loop(now) {
  const dt = prev ? now - prev : 0; prev = now;
  if (running && !paused) {
    effects.slow = Math.max(0, effects.slow - dt);
    effects.ghost = Math.max(0, effects.ghost - dt);
    if (now - lastStep >= stepInterval()) { lastStep = now; step(now); }
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= .94; p.vy *= .94; p.life -= .03; }
  particles = particles.filter(p => p.life > 0);
  statusText();
  draw();
  requestAnimationFrame(loop);
}

function start() {
  reset();
  bestAtStart = best;
  running = true; paused = false; lastStep = performance.now();
  $('overlay').classList.add('hidden');
}

function gameOver() {
  running = false;
  burst(snake[0][0], snake[0][1], COLORS.food);
  $('ovTitle').textContent = 'Fim de jogo';
  $('ovText').innerHTML = `Você fez <b style="color:var(--text)">${score}</b> pontos.` +
    (score > bestAtStart ? '<br>🏆 Novo recorde!' : '') + '<br>Enter ou o botão para jogar de novo.';
  document.querySelector('.legend').style.display = 'none';
  $('startBtn').textContent = 'Jogar de novo';
  $('overlay').classList.remove('hidden');
}

function togglePause() { if (running) paused = !paused; }

const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
  else if (e.key === ' ') { e.preventDefault(); running ? togglePause() : start(); }
  else if (e.key === 'Enter' && !running) start();
});

let touch = null;
canvas.addEventListener('touchstart', e => { touch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!touch) return;
  const dx = e.touches[0].clientX - touch[0], dy = e.touches[0].clientY - touch[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  touch = [e.touches[0].clientX, e.touches[0].clientY];
}, { passive: true });

document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => {
  b.dataset.dir === 'pause' ? togglePause() : turn(b.dataset.dir);
}));
$('startBtn').addEventListener('click', start);
addEventListener('resize', resize);

/* ---------- tema claro / escuro ---------- */
const CHAVE_TEMA = 'cobrinha-tema';
const temaEscuroSistema = matchMedia('(prefers-color-scheme: dark)');
const temaAtual = () => document.documentElement.dataset.theme || (temaEscuroSistema.matches ? 'dark' : 'light');
function mostrarTema() {
  const escuro = temaAtual() === 'dark';
  document.documentElement.classList.toggle('escuro', escuro);
  const txt = escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro';
  $('tema').setAttribute('aria-label', txt);
  $('tema').title = txt;
  document.querySelector('meta[name="theme-color"]').content = escuro ? '#07060f' : '#f3f0fb';
  readColors();
}
$('tema').addEventListener('click', () => {
  const novo = temaAtual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem(CHAVE_TEMA, novo); } catch {}
  mostrarTema();
  $('tema').blur();   // o Espaço continua pausando o jogo, sem apertar o botão de novo
});
temaEscuroSistema.addEventListener('change', mostrarTema);
mostrarTema();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

reset();
resize();
requestAnimationFrame(loop);
</script>
<script src="app-apk.js" data-repo="cobrinha-neon" data-apk="CobrinhaNeon.apk"></script>
</body>
</html>
